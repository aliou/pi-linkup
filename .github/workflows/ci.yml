name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check schema
        run: pnpm run --if-present check:schema

      - name: Test
        run: pnpm test

      - name: Verify published resources
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pi-linkup-pack.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const [pack] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pi-linkup-pack.json`, "utf8"));
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const paths = new Set(pack.files.map(file => file.path));
          for (const path of ["CHANGELOG.md", "README.md", "skills/linkup/SKILL.md", ...manifest.pi.extensions.map(path => path.replace(/^\.\//, ""))]) {
            if (!paths.has(path)) throw new Error(`Missing published resource: ${path}`);
          }
          NODE
