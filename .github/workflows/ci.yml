name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check schema
        run: pnpm run --if-present check:schema

      - name: Test
        run: pnpm test

      - name: Verify published resources
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pi-linkup-pack.json"
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const [pack] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/pi-linkup-pack.json`, "utf8"));
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const paths = new Set(pack.files.map(file => file.path));
          for (const path of ["CHANGELOG.md", "README.md", "skills/linkup/SKILL.md", ...manifest.pi.extensions.map(path => path.replace(/^\.\//, ""))]) {
            if (!paths.has(path)) throw new Error(`Missing published resource: ${path}`);
          }
          const consumer = `${process.env.RUNNER_TEMP}/pi-linkup-consumer`;
          mkdirSync(consumer, { recursive: true });
          const peers = Object.fromEntries(Object.keys(manifest.peerDependencies).map(name => [name, manifest.devDependencies[name]]));
          writeFileSync(`${consumer}/package.json`, JSON.stringify({ private: true, type: "module", dependencies: { ...peers, [manifest.name]: `file:${process.env.RUNNER_TEMP}/${pack.filename}` } }));
          NODE
          pnpm --dir "$RUNNER_TEMP/pi-linkup-consumer" install --ignore-scripts
          LINKUP_API_KEY=package-smoke-test PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-linkup-consumer/agent" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { discoverAndLoadExtensions } from "@earendil-works/pi-coding-agent";
          const consumer = `${process.env.RUNNER_TEMP}/pi-linkup-consumer`;
          const source = JSON.parse(readFileSync("package.json", "utf8"));
          const root = resolve(consumer, "node_modules", source.name);
          const manifest = JSON.parse(readFileSync(`${root}/package.json`, "utf8"));
          const loaded = await discoverAndLoadExtensions(manifest.pi.extensions.map(path => resolve(root, path)), consumer, process.env.PI_CODING_AGENT_DIR);
          assert.deepEqual(loaded.errors, []);
          assert.equal(loaded.extensions.length, manifest.pi.extensions.length);
          assert.deepEqual(loaded.extensions.flatMap(entry => [...entry.tools.keys()]), ["linkup_web_search", "linkup_web_answer", "linkup_web_fetch"]);
          assert.deepEqual(loaded.extensions.flatMap(entry => [...entry.commands.keys()]), ["linkup:balance", "linkup:settings"]);
          NODE
